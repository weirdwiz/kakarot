<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP relaxed for development - Vite needs ws: for HMR, blob: for modules -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' ws: wss:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' ws: wss: http://localhost:* https://fonts.googleapis.com https://fonts.gstatic.com;" />
    <title>Kakarot - AI Note Taker</title>
  </head>
  <body class="bg-surface text-cream">
    <div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;"><div style="width:24px;height:24px;border:2px solid #333;border-top-color:#888;border-radius:50%;animation:spin .6s linear infinite"></div></div></div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
